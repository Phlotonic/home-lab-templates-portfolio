global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production-us-east-1'
    service: 'core-checkout-api'

rule_files:
  - '/etc/prometheus/slo-recording-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter-fleet'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  - job_name: 'core-checkout-api'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'checkout-api-01:8080'
          - 'checkout-api-02:8080'
