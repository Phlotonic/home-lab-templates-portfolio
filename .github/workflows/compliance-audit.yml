name: 'Enterprise Architecture Compliance & Template Audit (65/65 Checks)'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance-audit:
    name: 'Render Templates & Verify 9-Module Compliance Suite'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render All 9 Parameterized Modules
        shell: pwsh
        run: ./render-all.ps1

      - name: Execute Full 65-Check Security, Architecture & IP Audit
        shell: pwsh
        run: ./validate-all.ps1
