---
- name: CIS Level 1 Linux Fleet Hardening & HashiCorp Vault Dynamic Secret Injection
  hosts: production_linux_fleet
  become: true
  tasks:
    - name: CIS 5.2.8 - Disable SSH Root Login & Password Authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }

    - name: CIS 3.2.1 - Enforce Kernel Network Hardening (SYN Cookies & Disable ICMP Redirects)
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { key: 'net.ipv4.tcp_syncookies', value: '1' }
        - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { key: 'kernel.randomize_va_space', value: '2' }

    - name: Fetch Ephemeral 1-Hour Database Lease from HashiCorp Vault
      ansible.builtin.uri:
        url: "https://vault.internal.quanumis.lab:8200/v1/database/creds/prod-app-ephemeral-readonly"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_WRAP_TOKEN') }}"
        return_content: true
      register: vault_db_lease
      no_log: true
