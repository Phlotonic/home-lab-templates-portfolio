# IEC 62443 Level 3.5 Industrial DMZ (IDMZ) Zero-Trust Conduit
# Enforces WireGuard Encrypted Transit + MQTT TLS 1.3 mTLS Read-Only Bridge
# =====================================================================

# --- 1. WireGuard Point-to-Point Industrial Conduit (/etc/wireguard/wg-ot0.conf) ---
[Interface]
Address = 10.99.0.1/30
ListenPort = 51820
# PrivateKey injected via HashiCorp Vault Agent / systemd-creds

[Peer]
# Enterprise Cloud Analytics Ingestion Gateway (IT Zone)
AllowedIPs = 10.99.0.2/32
PersistentKeepalive = 25

# --- 2. Mosquitto UNS/SCADA mTLS Broker (/etc/mosquitto/conf.d/idmz-mtls.conf) ---
listener 8883 10.99.0.1
allow_anonymous false
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
cafile /etc/mosquitto/certs/ot-root-ca.crt
certfile /etc/mosquitto/certs/idmz-broker.crt
keyfile /etc/mosquitto/certs/idmz-broker.key

# Unidirectional Topic ACL: Allow Read-Only UNS Telemetry Egress; Block Cloud-to-PLC Writes
# pattern read spBv1.0/plant-01/NDATA/#
# deny write spBv1.0/plant-01/NCMD/#
