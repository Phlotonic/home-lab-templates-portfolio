name: 'DevSecOps Container Supply-Chain: Trivy SBOM & Cosign Keyless Signing'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '08-cks-devsecops-gitops-supply-chain/**'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  supply-chain-gate:
    name: 'Trivy CVE Gate, CycloneDX SBOM & Cosign Sign'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Block CRITICAL & HIGH CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '08-cks-devsecops-gitops-supply-chain/'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '08-cks-devsecops-gitops-supply-chain/'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Install Sigstore Cosign CLI for Keyless OIDC Signing
        uses: sigstore/cosign-installer@v3.7.0

      - name: Verify Cosign Readiness
        run: cosign version
